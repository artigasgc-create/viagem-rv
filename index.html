<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Viagem RV">
<meta name="theme-color" content="#0b6a3d">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Viagem RV 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Placa verde de rodovia americana como ideia central; Overpass (família da Highway Gothic);
   verde de placa, branco, vermelho e azul do escudo interestadual; uma coluna, abas embaixo. */
:root{color-scheme:light dark;--bg:light-dark(#fbfbf8,#0e1311);--card:light-dark(#fff,#17201b);--ink:light-dark(#121614,#eef2ee);--mut:light-dark(#5b655f,#9ba79f);--line:light-dark(#e2e6e0,#2a342e);--green:#0b6a3d;--green2:light-dark(#e6f1ea,#123222);--gtxt:light-dark(#0b6a3d,#86d6a8);--red:#cf2027;--blue:#1d4ea3;--soft:light-dark(#f1f3ef,#1d2621)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Overpass,system-ui,-apple-system,sans-serif;overflow-x:clip;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,6vw,32px);font-weight:800}h2{font-size:22px;font-weight:800}h3{font-size:17px;font-weight:800}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:16px max(4vw,14px)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;min-height:46px;padding:10px 16px;font:600 16px Overpass,system-ui,sans-serif;cursor:pointer;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.pri{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}
.btn.huge{min-height:64px;font-size:20px;font-weight:800;border-radius:16px}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1 1 140px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.signwrap{position:relative;padding-bottom:40px;margin:4px 0 6px}
.sign{position:relative;z-index:1;background:var(--green);color:#fff;border-radius:16px;padding:18px 20px;box-shadow:inset 0 0 0 4px var(--green),inset 0 0 0 7px #fff,0 10px 24px rgba(0,0,0,.18);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.sign .k{font-weight:600;font-size:15px;opacity:.9}
.sign .dest{font-weight:800;font-size:clamp(30px,9vw,50px);line-height:1.02;margin:6px 0 8px;text-wrap:balance}
.sign .meta{font-weight:600;font-size:16px}
.sign svg{width:clamp(52px,13vw,84px);height:auto}
.post{position:absolute;bottom:0;width:12px;height:54px;background:linear-gradient(90deg,#8c949a,#c9cfd3 45%,#7b8388);border-radius:2px}.post.a{left:22%}.post.b{right:22%}
.status{border-radius:16px;padding:14px 16px;margin:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center}
.status.at{background:var(--green2)}.status.road{background:light-dark(#eaf0fb,#152038)}
.status .t{font-weight:800;font-size:clamp(26px,8vw,36px);line-height:1;white-space:nowrap}
.day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.day.now{background:var(--green2);border-radius:14px;padding:16px 12px;border-top-color:transparent}
.day .d{font-weight:800;font-size:32px;line-height:1;text-align:center}.day .d small{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .btn{min-height:40px;font-size:15px;padding:8px 12px}
.drive{display:inline-block;font-weight:600;font-size:14px;background:var(--soft);border-radius:8px;padding:2px 8px;margin-top:4px;white-space:nowrap}
.stops{margin:8px 0 0;padding:0;list-style:none}.stops li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.sb{display:flex;gap:4px;flex:none}.ib{min-width:40px;min-height:40px;border:0;border-radius:10px;background:var(--soft);color:var(--ink);font:600 15px Overpass,system-ui,sans-serif;cursor:pointer;padding:0 8px}.ib:disabled{opacity:.3}.ib.arm{background:var(--red);color:#fff}
.ib.go{background:var(--green);color:#fff;padding:0 12px}
.tag{font-size:12px;font-weight:600;background:var(--green2);color:var(--gtxt);border-radius:6px;padding:1px 6px;white-space:nowrap}
.big{font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.05;white-space:nowrap}
.bar{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bar .t{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}.bar .t i{display:block;height:100%;border-radius:7px}.bar b{font-weight:600;white-space:nowrap;text-align:right}
.meter{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;background:var(--green)}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;overflow:hidden}.item .ic img{width:100%;height:100%;object-fit:cover}
.item .v{text-align:right;font-weight:800;white-space:nowrap}.item .v small{display:block;font-weight:400;color:var(--mut);font-size:13px}
.grp{font-weight:800;margin:20px 0 2px;font-size:15px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:6px 12px;border-radius:20px;background:var(--soft);font:15px Overpass,system-ui,sans-serif;color:var(--ink);cursor:pointer;border:2px solid transparent}
.chip input{position:absolute;opacity:0;pointer-events:none}.chip:has(input:checked),.chip.on{border-color:var(--green);background:var(--green2);font-weight:600}
.vis{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.vis .h{font-weight:800;font-size:18px;line-height:1.15}.vis .h small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
.vis img{max-width:150px;border-radius:10px;margin-top:6px;display:block}
.leg{margin:2px 0 2px 82px;font-size:14px;color:var(--mut);border-left:3px dotted var(--blue);padding:4px 10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;color:var(--mut);text-decoration:none;font-size:12px;font-weight:600;min-height:60px}
nav a.on{color:var(--green)}nav svg{width:24px;height:24px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}.sheet.open{display:flex}
.sheet form{background:var(--card);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(4vw,16px) calc(20px + env(safe-area-inset-bottom))}
label.f{display:block;font-weight:600;font-size:15px;margin:14px 0 6px}
input,select,textarea{width:100%;font:16px Overpass,system-ui,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
textarea{min-height:84px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.prev{max-width:100%;max-height:220px;border-radius:12px;margin-top:10px;display:block}
.gps{font-size:14px;font-weight:600;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}.toast.on{opacity:1}
.empty{padding:28px 0;color:var(--mut);text-align:center}
.pt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}.pt input{min-height:42px}.pt .ib{grid-row:span 2;align-self:center}
.leg2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}.leg2 .sb a{display:grid;place-items:center;text-decoration:none}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}.note .ck{width:30px;height:30px;border-radius:8px;border:2px solid var(--green);background:transparent;cursor:pointer;color:#fff;font-weight:800}.note .ck.on{background:var(--green)}.note .tx{cursor:pointer;white-space:pre-line}.note.done .tx{color:var(--mut);text-decoration:line-through}.late{color:var(--red);font-weight:600}
nav a{font-size:11px}
.warn{background:light-dark(#fff4e0,#33260f);border-radius:12px;padding:10px 14px;font-size:14px;margin:10px 0}
@media(max-width:520px){.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) auto}.day{grid-template-columns:50px minmax(0,1fr)}.day .d{font-size:26px}.leg{margin-left:20px}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style></head><body>
<main class="wrap">
  <div class="top"><h1>Motorhome EUA 2027</h1><span class="small mut" id="clock"></span></div>
  <section id="view"></section>
</main>
<nav id="nav">
  <a href="#hoje" data-v="hoje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V9l8-5 8 5v11"/><path d="M12 20v-6"/></svg>Hoje</a>
  <a href="#roteiro" data-v="roteiro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Roteiro</a>
  <a href="#gastos" data-v="gastos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Gastos</a>
  <a href="#diario" data-v="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Diário</a>
  <a href="#notas" data-v="notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Notas</a>
  <a href="#arquivo" data-v="arquivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>Arquivo</a>
</nav>
<div class="sheet" id="sheet"><form id="form" novalidate></form></div>
<div class="toast" id="toast"></div>
<script src="seed.js"></script>
<script>
{
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[['comb','Combustível','#cf2027'],['camp','RV park / camping','#0b6a3d'],['rest','Restaurantes','#d97a00'],['merc','Mercado','#5f8a1f'],['pass','Passeios e ingressos','#1d4ea3'],['comp','Compras','#8a3fa0'],['tran','Pedágio, estacion., transporte','#5a6470'],['hosp','Aluguel do RV / hospedagem','#17808a'],['voo','Passagens','#2c4a7a'],['segu','Seguros','#8a6d3b'],['out','Outros','#8d8a80']];
const cat=k=>CATS.find(c=>c[0]===k)||CATS[CATS.length-1];
const PAYS=['Cartão de crédito','Cartão de crédito Chase (EUA)','Cartão global (Wise/Nomad)','Dinheiro','Pix/transferência','Outro'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
const todayISO=()=>new Date().toLocaleDateString('sv');
const fd=(s,o={weekday:'short',day:'2-digit',month:'short'})=>s?new Date(s.length<=10?s+'T12:00':s).toLocaleDateString('pt-BR',o):'';
const hm=s=>s?s.slice(11,16):'';
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const money=(n,c)=>(c==='BRL'?'R$ ':'US$ ')+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const dur=ms=>{if(!(ms>0))return '0 min';const m=Math.round(ms/6e4);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+'h'+(r?String(r).padStart(2,'0'):'')};
const ms=(a,b)=>new Date(b)-new Date(a);
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const stopOf=l=>{const p=l.split('||');return{name:p[0].trim(),addr:(p[1]||'').trim()}};
const stopsOf=d=>lines(d.stops).map(stopOf);
const mapq=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const mapll=(la,lo)=>'https://www.google.com/maps/search/?api=1&query='+la+','+lo;
const routeOK=d=>!!(d.from&&d.to&&(d.from!==d.to||stopsOf(d).some(s=>s.addr)));
const legsOf=d=>{const P=[];const add=(n,a)=>{if(!a||(P.length&&P[P.length-1].addr===a))return;P.push({name:n,addr:a})};add(d.from,d.from);stopsOf(d).filter(s=>s.addr).forEach(s=>add(s.name,s.addr));add(d.to,d.to);const L=[];for(let i=1;i<P.length;i++)L.push({a:P[i-1],b:P[i]});return L};
const legURL=(a,b)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(a)+'&destination='+encodeURIComponent(b)+'&travelmode=driving&dir_action=navigate';
const wazeURL=b=>'https://waze.com/ul?q='+encodeURIComponent(b)+'&navigate=yes';
const navURL=b=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(b)+'&travelmode=driving';
const legDone=(l,date)=>!!S.visits.find(v=>(v.arr||'').slice(0,10)===date&&(v.place===l.b.name||v.place===l.b.addr));
function legsHTML(d,hoje){const L=legsOf(d);if(!L.length)return '';const nx=L.findIndex(l=>!legDone(l,d.date));
  const gpsBtns=l=>`<span class="sb"><a class="ib go" href="${esc(legURL(l.a.addr,l.b.addr))}" target="_blank" rel="noopener">Maps</a><a class="ib" style="background:#33ccff;color:#062a3a" href="${esc(wazeURL(l.b.addr))}" target="_blank" rel="noopener">Waze</a></span>`;
  return `${hoje&&nx>=0?`<div class="card" style="border-color:var(--blue)"><div class="small mut">Próximo trecho ${nx+1} de ${L.length}</div><b style="font-size:20px">${esc(L[nx].b.name)}</b><div class="small mut">saindo de ${esc(L[nx].a.name)}</div><div class="small" style="margin-top:2px">${esc(L[nx].b.addr)}</div><div class="row" style="margin-top:10px"><a class="btn blue" href="${esc(legURL(L[nx].a.addr,L[nx].b.addr))}" target="_blank" rel="noopener">GPS no Google Maps</a><a class="btn" style="background:#33ccff;color:#062a3a" href="${esc(wazeURL(L[nx].b.addr))}" target="_blank" rel="noopener">GPS no Waze</a></div></div>`:''}
  <div class="small" style="margin-top:10px;font-weight:600">Trechos para o GPS</div>${L.map((l,i)=>`<div class="leg2"><span>${legDone(l,d.date)?'<b style="color:var(--gtxt)">✓</b> ':''}<b>${i+1}.</b> ${esc(l.a.name)} → <b>${esc(l.b.name)}</b><br><span class="small mut">${esc(l.b.addr)}</span></span>${gpsBtns(l)}</div>`).join('')}`}
const dayRoute=d=>{const w=stopsOf(d).filter(s=>s.addr).map(s=>s.addr).slice(0,9);return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(d.from)+'&destination='+encodeURIComponent(d.to)+(w.length?'&waypoints='+encodeURIComponent(w.join('|')):'')+'&travelmode=driving'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2800)}

/* ================= armazenamento no aparelho (IndexedDB) ================= */
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('viagem-rv',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=async(st,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
  return{get:(st,k)=>run(st,'readonly',s=>s.get(k)),set:(st,k,v)=>run(st,'readwrite',s=>s.put(v,k)),del:(st,k)=>run(st,'readwrite',s=>s.delete(k)),keys:st=>run(st,'readonly',s=>s.getAllKeys()),clear:st=>run(st,'readwrite',s=>s.clear())}})();
let S={days:[],exp:[],visits:[],cfg:{rate:5.87,budget:0,lastBackup:''}};
let saving=Promise.resolve();
function save(){saving=saving.then(()=>idb.set('kv','state',JSON.parse(JSON.stringify(S)))).catch(()=>toast('Erro ao salvar no aparelho'));render();return saving}
const urls={};
async function photoURL(id){if(!id)return '';if(urls[id])return urls[id];try{const b=await idb.get('photos',id);if(b){urls[id]=URL.createObjectURL(b);return urls[id]}}catch(e){}return ''}
async function hydratePhotos(){for(const im of document.querySelectorAll('img[data-ph]')){const u=await photoURL(im.dataset.ph);if(u){im.src=u;im.hidden=false}}}
async function shrink(file,max,q){try{const b=await createImageBitmap(file);const k=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',q))}catch(e){return file}}
const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

/* ================= GPS ================= */
function gps(){return new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:15000,maximumAge:30000})})}

/* ================= estado da viagem ================= */
const days=()=>[...S.days].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
const vis=()=>[...S.visits].sort((a,b)=>(a.arr||'').localeCompare(b.arr||''));
const openVisit=()=>vis().filter(v=>!v.dep).pop();
const lastDep=()=>vis().filter(v=>v.dep).map(v=>v.dep).sort().pop();
const rate=()=>num(S.cfg.rate)||1;
const usd=e=>e.cur==='BRL'?num(e.amt)/rate():num(e.amt);
const brl=e=>e.cur==='BRL'?num(e.amt):num(e.amt)*rate();
function where(){const L=days(),t=todayISO();if(!L.length)return{L,t};const i=L.findIndex(d=>d.date===t);
  if(i>=0)return{L,t,cur:L[i],next:L[i+1],phase:'on'};
  if(t<L[0].date)return{L,t,cur:null,next:L[0],phase:'pre',left:Math.round((new Date(L[0].date+'T12:00')-new Date(t+'T12:00'))/864e5)};
  const nx=L.find(d=>d.date>t);return nx?{L,t,cur:null,next:nx,phase:'on'}:{L,t,phase:'post'}}
const visitOf=(name,date)=>S.visits.filter(v=>v.place===name&&(v.arr||'').slice(0,10)===date).pop();

async function arrive(place,note){const now=iso(Date.now());const ov=openVisit();if(ov){ov.dep=now;ov.depAuto=true}
  const v={id:uid(),place,arr:now,dep:'',note:note||'',photo:''};S.visits.push(v);await save();toast('Chegada em '+place+' às '+hm(now));
  const g=await gps();if(g){const x=S.visits.find(y=>y.id===v.id);if(x&&!x.arrGps){x.arrGps=g;await save()}}else toast('Chegada salva sem GPS (sem permissão ou sinal)');return v}
async function depart(){const v=openVisit();if(!v)return;v.dep=iso(Date.now());v.depAuto=false;await save();toast('Saída registrada · '+dur(ms(v.arr,v.dep))+' em '+v.place);const g=await gps();if(g){const x=S.visits.find(y=>y.id===v.id);if(x){x.depGps=g;await save()}}}

/* ================= telas ================= */
function statusBox(){const ov=openVisit(),ld=lastDep(),now=Date.now();
  if(ov)return `<div class="status at"><div><div class="small mut">Você está em</div><b style="font-size:18px">${esc(ov.place)}</b><div class="t" style="margin-top:6px">${esc(dur(now-new Date(ov.arr)))}</div><div class="small mut">desde ${esc(hm(ov.arr))}</div></div><button class="btn red huge" data-act="dep">Saí</button></div>`;
  if(ld&&now-new Date(ld)<16*36e5)return `<div class="status road"><div><div class="small mut">Na estrada desde ${esc(hm(ld))}</div><div class="t" style="margin-top:6px">${esc(dur(now-new Date(ld)))}</div></div><button class="btn pri huge" data-act="arr">Cheguei</button></div>`;
  return `<button class="btn pri huge" style="width:100%;margin:12px 0" data-act="arr">Cheguei</button>`}
function vHoje(){const w=where(),L=w.L;
  if(!L.length)return `<div class="card empty">Nenhum dia no roteiro.<br><br><a class="btn pri" href="#roteiro">Importar planilha ou adicionar dia</a></div>`;
  if(w.phase==='post')return `<div class="card"><h2>Viagem encerrada</h2><p class="mut">Vá na aba Arquivo e baixe o relatório completo.</p></div>`+statusBox();
  const d=w.cur||w.next,idx=L.indexOf(d)+1,moving=d.from&&d.to&&d.from!==d.to;
  const head=w.phase==='pre'?`Faltam <b>${w.left}</b> ${w.left===1?'dia':'dias'} · começa ${esc(fd(d.date,{day:'2-digit',month:'long'}))}`:`Dia ${idx} de ${L.length} · ${esc(fd(d.date,{weekday:'long',day:'2-digit',month:'long'}))}`;
  const te=S.exp.filter(e=>e.date===w.t);const st=stopsOf(d);
  const bk=S.cfg.lastBackup?Math.floor((Date.now()-new Date(S.cfg.lastBackup))/864e5):null;
  return `<p class="mut" style="margin:0 0 10px">${head}</p>
  ${w.phase==='on'&&(bk===null||bk>=2)&&(S.visits.length||S.exp.length>3)?`<div class="warn">${bk===null?'Você ainda não fez backup.':'Último backup há '+bk+' dias.'} Os dados ficam só neste iPhone. <a href="#arquivo">Fazer backup</a></div>`:''}
  <div class="signwrap"><div class="sign"><div><div class="k">${moving?'Próximo destino':'Hoje em'}</div><div class="dest">${esc(d.to||d.title||'—')}</div><div class="meta">${esc(d.drive||'')}${d.stay?`${d.drive?' · ':''}Pernoite: ${esc(d.stay)}`:''}</div></div>
  <svg viewBox="0 0 80 80" aria-hidden="true"><path d="M18 62 L56 24" stroke="#fff" stroke-width="10"/><path d="M30 20 H60 V50" fill="none" stroke="#fff" stroke-width="10"/></svg></div><i class="post a"></i><i class="post b"></i></div>
  ${(()=>{const end=w.t+'T23:59';const due=(S.notes||[]).filter(n=>n.when&&!n.done&&n.when<=end).sort((a,b)=>a.when.localeCompare(b.when));return due.length?`<div class="card" style="border-color:var(--red)"><h3>Lembretes de hoje</h3>${due.map(noteItem).join('')}</div>`:''})()}
  ${statusBox()}
  <button class="btn red" style="width:100%" data-act="exp">+ Gasto</button>${(()=>{const L=legsOf(d),nx=L.findIndex(l=>!legDone(l,d.date));return nx>=0?legsHTML(d,true).split('<div class="small" style="margin-top:10px;font-weight:600">Trechos para o GPS</div>')[0]:''})()}
  <div class="card"><h3>${esc(d.title||'Programação')}</h3>${moving?`<p class="mut small" style="margin:4px 0 0">${esc(d.from)} → ${esc(d.to)}</p>`:''}
   ${st.length?`<ul class="stops">${st.map(s=>{const v=visitOf(s.name,d.date);return `<li><span>${v?'<b style="color:var(--gtxt)">✓</b> ':''}${esc(s.name)}${v?` <span class="small mut">${esc(hm(v.arr))}${v.dep?' · '+esc(dur(ms(v.arr,v.dep))):' · agora'}</span>`:''}</span>${v?'':`<button class="ib go" data-act="arrq" data-place="${esc(s.name)}">Cheguei</button>`}</li>`}).join('')}</ul>`:''}
   ${legsHTML(d,false)}${d.notes?`<p class="small mut" style="white-space:pre-line">${esc(d.notes)}</p>`:''}
   <div class="row" style="margin-top:10px"><button class="btn" data-act="stop" data-id="${esc(d.id)}">+ Parada</button><button class="btn" data-act="day" data-id="${esc(d.id)}">Editar dia</button></div></div>
  ${w.next&&w.cur?`<p class="mut small">Amanhã: <b>${esc(w.next.title||w.next.to)}</b>${w.next.drive?' · '+esc(w.next.drive):''}</p>`:''}
  <div class="card"><div class="mut small">Gasto hoje</div><div class="big">${esc(money(te.reduce((s,e)=>s+usd(e),0)))}</div><div class="mut small">${te.length} lançamento(s) · viagem ${esc(money(S.exp.reduce((s,e)=>s+usd(e),0)))}</div></div>`}

function vRoteiro(){const L=days(),t=todayISO();const seq=[];L.forEach(d=>{if(d.from&&!seq.length)seq.push(d.from);if(d.to&&seq[seq.length-1]!==d.to)seq.push(d.to)});
  const full=seq.length>2?'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(seq[0])+'&destination='+encodeURIComponent(seq[seq.length-1])+'&waypoints='+encodeURIComponent(seq.slice(1,-1).slice(0,9).join('|'))+'&travelmode=driving':'';
  return `<div class="row" style="margin-bottom:10px"><label class="btn blue">Importar planilha<input type="file" id="impx" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden></label><button class="btn" data-act="xlx">Baixar em Excel</button></div>
  <div class="row" style="margin-bottom:6px">${full?`<a class="btn blue" href="${esc(full)}" target="_blank" rel="noopener">Rota completa no Maps</a>`:''}<button class="btn pri" data-act="day">+ Dia</button></div>
  <p class="small mut">Trechos = Saindo de → cada ponto com endereço, na ordem → Destino. Cada trecho tem botão para abrir no GPS (Google Maps ou Waze). Ponto sem endereço é só lembrete. Tempos de estrada são estimativas de carro.</p>
  ${L.map((d,i)=>{const st=stopsOf(d);return `<article class="day ${d.date===t?'now':''}"><div class="d">${esc(fd(d.date,{day:'2-digit'}))}<small>${esc(fd(d.date,{month:'short'}))} · ${esc(fd(d.date,{weekday:'short'}))}</small></div>
   <div><h3>${esc(d.title||'Dia '+(i+1))}</h3>${d.from&&d.to&&d.from!==d.to?`<div class="small mut">${esc(d.from)} → ${esc(d.to)}</div>`:''}${d.drive?`<span class="drive">${esc(d.drive)}</span>`:''}
   ${st.length?`<ol class="stops">${st.map((s,j)=>{const v=visitOf(s.name,d.date);return `<li><span>${v?'<b style="color:var(--gtxt)">✓</b> ':''}${esc(s.name)}${s.addr?' <span class="tag">na rota</span>':''}${v&&v.dep?` <span class="small mut">${esc(dur(ms(v.arr,v.dep)))}</span>`:''}</span><span class="sb"><button class="ib" data-act="mv" data-id="${esc(d.id)}" data-i="${j}" data-dir="-1" aria-label="Subir" ${j?'':'disabled'}>↑</button><button class="ib" data-act="mv" data-id="${esc(d.id)}" data-i="${j}" data-dir="1" aria-label="Descer" ${j<st.length-1?'':'disabled'}>↓</button><button class="ib" data-act="rm" data-id="${esc(d.id)}" data-i="${j}" aria-label="Remover">✕</button></span></li>`}).join('')}</ol>`:''}
   ${d.stay?`<div class="small" style="margin-top:6px"><b>Pernoite:</b> ${esc(d.stay)}</div>`:''}${d.notes?`<div class="small mut" style="white-space:pre-line;margin-top:4px">${esc(d.notes)}</div>`:''}
   ${legsHTML(d,false)}<div class="acts"><button class="btn" data-act="stop" data-id="${esc(d.id)}">+ Parada</button><button class="btn" data-act="day" data-id="${esc(d.id)}">Editar</button></div></div></article>`}).join('')||'<div class="empty">Sem dias.</div>'}`}

let fCat='all',fWhen='all';
function totals(list){const tot=list.reduce((s,e)=>s+usd(e),0);const by=CATS.map(c=>[c[1],list.filter(e=>e.cat===c[0]).reduce((s,e)=>s+usd(e),0),c[2]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const bp=PAYS.map(p=>[p,list.filter(e=>e.pay===p).reduce((s,e)=>s+usd(e),0),p.includes('Chase')?'#117aca':'#8d8a80']).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);return{tot,by,bp}}
const bars=rows=>{const m=rows.length?rows[0][1]:1;return rows.map(([l,v,c])=>`<div class="bar"><span>${esc(l)}</span><span class="t"><i style="width:${(v/m*100).toFixed(1)}%;background:${c}"></i></span><b>${esc(money(v))}</b></div>`).join('')};
function vGastos(){const L=days(),first=L[0]?.date||'9999',t=todayISO();let list=[...S.exp];
  if(fCat!=='all')list=list.filter(e=>e.cat===fCat);if(fWhen==='hoje')list=list.filter(e=>e.date===t);if(fWhen==='pre')list=list.filter(e=>(e.date||'')<first);if(fWhen==='trip')list=list.filter(e=>(e.date||'')>=first);
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));const g={};list.forEach(e=>{(g[e.date||'']=g[e.date||'']||[]).push(e)});
  const T=totals(S.exp),bud=num(S.cfg.budget);
  return `<button class="btn red huge" style="width:100%" data-act="exp">+ Gasto</button>
  <div class="row" style="margin-top:10px"><label class="btn">Importar planilha<input type="file" id="impe" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden></label><button class="btn" data-act="xle">Baixar em Excel</button></div>
  <div class="card"><div class="mut small">Total da viagem</div><div class="big">${esc(money(T.tot))}</div><div class="mut">${esc(money(T.tot*rate(),'BRL'))} a R$ ${esc(rate().toFixed(2).replace('.',','))}</div>
  ${bud?`<div class="meter"><i style="width:${Math.min(100,T.tot/bud*100).toFixed(1)}%;${T.tot>bud?'background:var(--red)':''}"></i></div><div class="small mut" style="margin-top:4px">${Math.round(T.tot/bud*100)}% do orçamento de ${esc(money(bud))}</div>`:''}
  ${T.by.length?`<h3 style="margin-top:14px">Por categoria</h3>${bars(T.by)}`:''}${T.bp.length?`<h3 style="margin-top:14px">Por forma de pagamento</h3>${bars(T.bp)}`:''}</div>
  <div class="chips" style="margin:6px 0 8px">${[['all','Tudo'],['hoje','Hoje'],['pre','Pré-viagem'],['trip','Na viagem']].map(([k,l])=>`<button class="chip ${fWhen===k?'on':''}" data-act="fw" data-k="${k}">${l}</button>`).join('')}</div>
  <select data-act="fc" aria-label="Categoria"><option value="all">Todas as categorias</option>${CATS.map(c=>`<option value="${c[0]}" ${fCat===c[0]?'selected':''}>${esc(c[1])}</option>`).join('')}</select>
  ${list.length?Object.entries(g).map(([dt,es])=>`<div class="grp">${dt?esc(fd(dt,{weekday:'short',day:'2-digit',month:'short',year:'numeric'})):'Sem data'} · ${esc(money(es.reduce((s,e)=>s+usd(e),0)))}</div>`+es.map(e=>{const c=cat(e.cat);return `<div class="item" data-act="exp" data-id="${esc(e.id)}"><div class="ic" style="background:${c[2]}">${e.photo?`<img data-ph="${esc(e.photo)}" alt="" hidden>`:esc(c[1].slice(0,1))}</div><div><b>${esc(e.desc||c[1])}</b><div class="small mut">${esc(c[1])}${e.pay?' · '+esc(e.pay):''}</div></div><div class="v">${esc(money(num(e.amt),e.cur))}<small>${e.cur==='BRL'?esc(money(usd(e))):esc(money(brl(e),'BRL'))}</small></div></div>`}).join('')).join(''):'<div class="empty">Nenhum gasto neste filtro.</div>'}`}

function dayLog(date){const V=vis().filter(v=>(v.arr||'').slice(0,10)===date);let at=0,road=0;V.forEach((v,i)=>{if(v.dep)at+=ms(v.arr,v.dep);const p=V[i-1];if(p&&p.dep)road+=Math.max(0,ms(p.dep,v.arr))});return{V,at,road}}
function vDiario(){const dates=[...new Set(vis().map(v=>(v.arr||'').slice(0,10)))].sort().reverse();
  return `${statusBox()}<p class="small mut">Cada chegada guarda a hora e o GPS. O tempo entre sair de um lugar e chegar no próximo conta como estrada.</p>
  ${dates.length?dates.map(dt=>{const{V,at,road}=dayLog(dt);return `<div class="grp">${esc(fd(dt,{weekday:'long',day:'2-digit',month:'long'}))}</div><div class="small mut">Nos lugares ${esc(dur(at))} · estrada ${esc(dur(road))}</div>`+V.map((v,i)=>{const p=V[i-1];return (p&&p.dep?`<div class="leg">estrada ${esc(dur(ms(p.dep,v.arr)))}</div>`:'')+`<div class="vis" data-act="vis" data-id="${esc(v.id)}"><div class="h">${esc(hm(v.arr))}<small>${v.dep?'até '+esc(hm(v.dep)):'agora'}</small></div><div><b>${esc(v.place)}</b> <span class="small mut">${v.dep?esc(dur(ms(v.arr,v.dep))):'em andamento'}</span>${v.note?`<div class="small" style="white-space:pre-line">${esc(v.note)}</div>`:''}${v.photo?`<img data-ph="${esc(v.photo)}" alt="" hidden>`:''}<div class="small mut">${v.arrGps?`GPS ±${esc(v.arrGps.acc)} m`:'sem GPS'}</div></div></div>`}).join('')}).join(''):'<div class="empty">Nenhuma chegada registrada ainda.</div>'}`}

function noteWhen(n){if(!n.when)return '';const late=!n.done&&n.when<iso(Date.now());return `<span class="${late?'late':'mut'} small">${late?'Atrasado · ':''}${esc(fd(n.when,{weekday:'short',day:'2-digit',month:'short'}))} ${esc(hm(n.when))}</span>`}
const noteItem=n=>{const [t,...r]=String(n.text||'').split('\n');return `<div class="note ${n.done?'done':''}"><button class="ck ${n.done?'on':''}" data-act="ntog" data-id="${esc(n.id)}" aria-label="Concluir">${n.done?'✓':''}</button><div class="tx" data-act="note" data-id="${esc(n.id)}"><b>${esc(t)}</b>${r.length?'<br>'+esc(r.join('\n')):''}${n.when?'<br>'+noteWhen(n):''}</div></div>`};
function vNotas(){const N=S.notes||[];const rem=N.filter(n=>n.when&&!n.done).sort((a,b)=>a.when.localeCompare(b.when));const notes=N.filter(n=>!n.when&&!n.done).sort((a,b)=>(b.ts||0)-(a.ts||0));const done=N.filter(n=>n.done).sort((a,b)=>(b.ts||0)-(a.ts||0));
  return `<button class="btn pri huge" style="width:100%" data-act="note">+ Anotação ou lembrete</button>
  <h3 style="margin-top:18px">Lembretes</h3>${rem.length?rem.map(noteItem).join(''):'<p class="small mut">Nenhum lembrete com data.</p>'}
  <h3 style="margin-top:18px">Anotações</h3>${notes.length?notes.map(noteItem).join(''):'<p class="small mut">Nenhuma anotação.</p>'}
  ${done.length?`<details style="margin-top:18px"><summary class="mut">Concluídos (${done.length})</summary>${done.map(noteItem).join('')}</details>`:''}
  <p class="small mut" style="margin-top:16px">O app não consegue tocar alarme sozinho. Para ser avisado na hora, use “Adicionar ao calendário” no lembrete: o alerta fica no Calendário do iPhone.</p>`}
function openNote(id){const n=(S.notes||[]).find(x=>x.id===id)||{};kind='note';editId=n.id||'';
  open(`<h2>${n.id?'Editar':'Nova anotação'}</h2><label class="f" for="nt">Texto</label><textarea id="nt" name="text" style="min-height:140px" placeholder="Primeira linha vira o título">${esc(n.text||'')}</textarea>
  <label class="f" for="nw">Lembrar em (opcional)</label><input id="nw" name="when" type="datetime-local" value="${esc(n.when||'')}">
  ${n.id&&n.when?`<button class="btn" type="button" data-act="ics" style="width:100%;margin-top:10px">Adicionar ao calendário do iPhone</button>`:''}${foot(!!n.id)}`);setTimeout(()=>{const t=$('#nt');if(t&&!n.id)t.focus()},60)}
function icsFor(n){const p=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');const dt=s=>s.replace(/[-:]/g,'')+'00';const end=iso(new Date(n.when).getTime()+15*6e4);const [t,...r]=String(n.text).split('\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//ViagemRV//PT','BEGIN:VEVENT','UID:'+n.id+'@viagem-rv','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+dt(n.when),'DTEND:'+dt(end),'SUMMARY:'+p(t),'DESCRIPTION:'+p(r.join('\n')),'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+p(t),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}
function vArquivo(){const sa=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;const bk=S.cfg.lastBackup;
  return `${sa?'':`<div class="card"><h3>Instalar no iPhone</h3><p class="small">No Safari, toque em Compartilhar (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>. Depois use sempre pelo ícone verde: os dados ficam guardados no app instalado, não no Safari.</p></div>`}
  <div class="card"><h3>Relatório da viagem</h3><p class="small mut">Arquivo único (abre no navegador do PC e imprime em PDF) com resumo, dia a dia, tempos, gastos e fotos dos cupons.</p><button class="btn pri" style="width:100%" data-act="report">Baixar relatório</button>
  <button class="btn" style="width:100%;margin-top:10px" data-act="csv">Baixar planilha de gastos (CSV)</button><button class="btn" style="width:100%;margin-top:10px" data-act="csvv">Baixar planilha de lugares e tempos (CSV)</button></div>
  <div class="card"><h3>Backup</h3><p class="small mut">${bk?'Último backup: '+esc(fd(bk,{day:'2-digit',month:'short'}))+' às '+esc(hm(bk)):'Nenhum backup ainda.'} Salve no iCloud Drive ou mande para o seu e-mail. Se perder o iPhone, você restaura em outro aparelho.</p>
  <button class="btn blue" style="width:100%" data-act="backup">Fazer backup agora</button><label class="btn" style="width:100%;margin-top:10px">Restaurar backup<input type="file" id="restore" accept=".json,application/json" hidden></label></div>
  <div class="card"><h3>Leitura de cupom com IA</h3><p class="small mut">${aiKey?'Chave cadastrada (termina em …'+esc(aiKey.slice(-4))+'). ':''}Usa a sua chave da API da Claude (console.anthropic.com). A chave fica só neste iPhone: não vai para o GitHub nem para o backup. Cada cupom custa uma fração de centavo de dólar.</p>
  <input id="aik" type="password" autocomplete="off" placeholder="sk-ant-…" value=""><div class="row" style="margin-top:10px"><button class="btn pri" data-act="aikey">Salvar chave</button>${aiKey?'<button class="btn" data-act="aikey" onclick="document.getElementById(\'aik\').value=\'\'">Remover chave</button>':''}</div></div>
  <div class="card"><h3>Câmbio e orçamento</h3><div class="two"><div><label class="f" for="rt">R$ por US$</label><input id="rt" inputmode="decimal" value="${esc(String(S.cfg.rate).replace('.',','))}" data-cfg="rate"></div><div><label class="f" for="bd">Orçamento (US$)</label><input id="bd" inputmode="decimal" value="${S.cfg.budget?esc(String(S.cfg.budget).replace('.',',')):''}" placeholder="opcional" data-cfg="budget"></div></div><p class="small mut">Use a taxa efetiva que você paga (com IOF no cartão brasileiro).</p></div>
  <p class="small mut" id="stor"></p>`}

function render(){const v=(location.hash||'#hoje').slice(1);const V={hoje:vHoje,roteiro:vRoteiro,gastos:vGastos,diario:vDiario,notas:vNotas,arquivo:vArquivo}[v]||vHoje;
  const keep=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.cfg;if(keep)return;
  $('#view').innerHTML=V();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===(V===vHoje?'hoje':v)));
  $('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});hydratePhotos();
  if(V===vArquivo&&navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const el=$('#stor');if(el)el.textContent='Espaço usado: '+(e.usage/1048576).toFixed(1)+' MB'}).catch(()=>{})}

/* ================= formulários ================= */
const sheet=$('#sheet'),form=$('#form');let kind='',editId='',curPhoto='',pending=null,pendingUrl='',gpsFix=null;
function open(html){form.innerHTML=html;sheet.classList.add('open');pending=null;gpsFix=null}
function close(){sheet.classList.remove('open');form.innerHTML='';if(pendingUrl){URL.revokeObjectURL(pendingUrl);pendingUrl=''}}

/* ================= leitura de cupom com IA (Claude API, chave fica só no aparelho) ================= */
let aiKey='';
async function receiptBlob(){if(pending)return pending;if(curPhoto){try{return await idb.get('photos',curPhoto)}catch(e){}}return null}
async function readReceipt(btn){const msg=t=>{const m=$('#fmsg');if(m)m.textContent=t};const blob=await receiptBlob();if(!blob)return msg('Tire ou escolha a foto do cupom primeiro.');if(!aiKey)return msg('Cadastre a chave da IA na aba Arquivo.');
  if(btn){btn.disabled=true;btn.textContent='Lendo o cupom…'}
  try{const small=await shrink(blob,1568,.85);const b64=(await toData(small)).split(',')[1];
    const prompt=`Você lê cupons fiscais, recibos e notas de compra de uma viagem de motorhome nos EUA. Na imagem, encontre o TOTAL efetivamente pago (com impostos e gorjeta, se houver), a moeda, o nome do estabelecimento e a data. Classifique em uma destas categorias pelo código: ${CATS.map(c=>c[0]+' = '+c[1]).join('; ')}. Se aparecer forma de pagamento, diga se foi cartão ou dinheiro. Responda SOMENTE com JSON: {"total": número ou null, "moeda": "USD" ou "BRL", "estabelecimento": texto, "data": "AAAA-MM-DD" ou null, "categoria": código, "pagamento": "cartao" ou "dinheiro" ou null}`;
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':aiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
    if(!r.ok){const t=r.status===401?'Chave da IA inválida. Confira na aba Arquivo.':(r.status===429||r.status===529?'Serviço ocupado; tente de novo em instantes.':(r.status===400?'Sem crédito na conta da IA ou foto ilegível.':'Erro da IA ('+r.status+').'));throw new Error(t)}
    const j=await r.json();const txt=(j.content||[]).map(c=>c.text||'').join('');const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('A IA não conseguiu ler este cupom.');const o=JSON.parse(m[0]);
    if(!form.elements['amt'])return;
    if(typeof o.total==='number'&&o.total>0)form.elements['amt'].value=String(o.total).replace('.',',');
    if(o.moeda==='BRL'||o.moeda==='USD')form.elements['cur'].value=o.moeda;
    if(typeof o.estabelecimento==='string'&&o.estabelecimento&&!form.elements['desc'].value)form.elements['desc'].value=o.estabelecimento.slice(0,80);
    if(typeof o.data==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(o.data))form.elements['date'].value=o.data;
    const cc=CATS.find(c=>c[0]===o.categoria);if(cc){const rb=form.querySelector(`input[name=cat][value="${cc[0]}"]`);if(rb)rb.checked=true}
    if(o.pagamento==='dinheiro')form.elements['pay'].value='Dinheiro';
    msg(typeof o.total==='number'?'Lido pela IA. Confira o valor e a forma de pagamento antes de salvar.':'Não achei o total; digite o valor.')}
  catch(e){msg(e instanceof TypeError?'Sem internet agora. Salve com a foto e use “Ler cupom” depois, abrindo o gasto.':(e.message||'Erro na leitura.'))}
  if(btn&&btn.isConnected){btn.disabled=false;btn.textContent='Ler cupom com IA'}}

/* ================= roteiro em Excel ================= */
let XLp=null;const loadXL=()=>XLp||(XLp=new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{XLp=null;rej(new Error('Não consegui carregar o leitor de planilhas (abra o app com internet uma vez).'))};document.head.appendChild(s)}));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function xlDate(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);
  const s=String(v??'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return ''}
const COLS={date:['data','dia','date'],title:['titulo','title','programacao','descricao'],from:['saindode','origem','saida','de','from'],to:['destino','para','chegada','to'],drive:['estrada','tempo','tempodeestrada','distancia','drive'],stay:['pernoite','dormir','hospedagem','camping','stay'],stops:['paradas','passeios','stops'],notes:['observacoes','obs','notas','notes'],order:['ordem','n','numero','seq'],name:['parada','nome','lugar','local'],addr:['endereco','enderecomaps','maps','address']};
function mapHead(row){const idx={};row.forEach((c,i)=>{const n=norm(c);for(const[k,al]of Object.entries(COLS))if(idx[k]===undefined&&al.includes(n))idx[k]=i});return idx}
function findHead(rows){for(let i=0;i<Math.min(rows.length,10);i++){const ix=mapHead(rows[i]);if(ix.date!==undefined)return{i,ix}}return null}
function parseStopsCell(v){return String(v??'').split(/\r?\n|;/).map(x=>x.trim()).filter(Boolean).map(x=>{const p=x.split(/\s*\|\|?\s*/);return (p[0]||'').trim()+(p[1]&&p[1].trim()?' || '+p[1].trim():'')})}
async function parseRoteiro(file){const X=await loadXL();const wb=X.read(await file.arrayBuffer(),{type:'array'});
  const sheets=wb.SheetNames.map(n=>({n,rows:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})}));
  let dias=null,par=null;for(const sh of sheets){const h=findHead(sh.rows);if(!h)continue;const isStops=h.ix.name!==undefined&&h.ix.title===undefined&&h.ix.to===undefined;if(isStops&&!par)par={...h,rows:sh.rows};else if(!isStops&&!dias)dias={...h,rows:sh.rows}}
  if(!dias)throw new Error('Não achei a coluna "Data". Use o modelo baixado pelo app.');
  const g=(r,k,ix)=>ix[k]===undefined?'':String(r[ix[k]]??'').trim();
  const out=[];for(const r of dias.rows.slice(dias.i+1)){const date=xlDate(r[dias.ix.date]);if(!date)continue;out.push({id:'d'+date.replace(/-/g,''),date,title:g(r,'title',dias.ix),from:g(r,'from',dias.ix),to:g(r,'to',dias.ix),drive:g(r,'drive',dias.ix),stay:g(r,'stay',dias.ix),stops:parseStopsCell(dias.ix.stops===undefined?'':r[dias.ix.stops]).join('\n'),notes:g(r,'notes',dias.ix)})}
  if(par){const by={};par.rows.slice(par.i+1).forEach((r,k)=>{const date=xlDate(r[par.ix.date]);const nm=g(r,'name',par.ix).replace(/\|/g,'/');if(!date||!nm)return;(by[date]=by[date]||[]).push({o:num(par.ix.order===undefined?k:r[par.ix.order])||k,line:nm+(g(r,'addr',par.ix)?' || '+g(r,'addr',par.ix).replace(/\|/g,'/'):'')})});
    out.forEach(d=>{if(by[d.date])d.stops=by[d.date].sort((a,b)=>a.o-b.o).map(x=>x.line).join('\n')})}
  const seen={};const days=out.filter(d=>seen[d.date]?false:(seen[d.date]=1));days.sort((a,b)=>a.date.localeCompare(b.date));if(!days.length)throw new Error('Nenhuma linha com data válida.');return days}
let importDays=null;
async function onImportFile(file){try{toast('Lendo planilha…');importDays=await parseRoteiro(file);const ns=importDays.reduce((s,d)=>s+lines(d.stops).length,0);kind='imp';editId='';
  open(`<h2>Importar roteiro</h2><p>${importDays.length} dias e ${ns} paradas, de ${esc(fd(importDays[0].date,{day:'2-digit',month:'short'}))} a ${esc(fd(importDays[importDays.length-1].date,{day:'2-digit',month:'short',year:'numeric'}))}.</p>
  <ol class="stops">${importDays.map(d=>`<li><span><b>${esc(fd(d.date,{day:'2-digit',month:'short'}))}</b> ${esc(d.title||d.to||'')}${lines(d.stops).length?` <span class="small mut">${lines(d.stops).length} parada(s)</span>`:''}</span></li>`).join('')}</ol>
  <p class="small mut">O roteiro atual será substituído por este. Gastos, chegadas e fotos não mudam.</p><div class="row" style="margin-top:16px"><button class="btn pri" type="submit">Substituir roteiro</button><button class="btn" type="button" data-act="close">Cancelar</button></div><p class="small mut" id="fmsg"></p>`)}
  catch(e){toast(e.message||'Não consegui ler a planilha')}}
async function exportRoteiro(){const X=await loadXL();const L=days();
  const d1=[['Data','Título','Saindo de','Destino','Estrada','Pernoite','Observações']].concat(L.map(d=>[d.date.split('-').reverse().join('/'),d.title,d.from,d.to,d.drive,d.stay,d.notes]));
  const d2=[['Data','Ordem','Parada','Endereço (para a rota)']];L.forEach(d=>stopsOf(d).forEach((s,i)=>d2.push([d.date.split('-').reverse().join('/'),i+1,s.name,s.addr])));
  const wb=X.utils.book_new();const s1=X.utils.aoa_to_sheet(d1),s2=X.utils.aoa_to_sheet(d2);s1['!cols']=[{wch:11},{wch:34},{wch:30},{wch:30},{wch:24},{wch:34},{wch:40}];s2['!cols']=[{wch:11},{wch:7},{wch:40},{wch:50}];
  const s3=X.utils.aoa_to_sheet([['Como usar'],['Aba Dias: uma linha por dia. Data no formato dd/mm/aaaa.'],['Aba Paradas: uma linha por parada, na ordem do dia. Com endereço, a parada vira um trecho de rota no Maps.'],['Para atualizar: edite, salve e no app vá em Roteiro → Importar planilha. O roteiro inteiro é substituído; gastos e chegadas ficam.']]);s3['!cols']=[{wch:110}];
  X.utils.book_append_sheet(wb,s1,'Dias');X.utils.book_append_sheet(wb,s2,'Paradas');X.utils.book_append_sheet(wb,s3,'Como usar');
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});await deliver(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'roteiro-viagem-'+stamp()+'.xlsx')}

const ECOLS={date:['data','date','dia'],cat:['categoria','category','tipo'],desc:['descricao','estabelecimento','historico','description','local'],amt:['valor','amount','preco','valorpago'],cur:['moeda','currency'],pay:['pagamento','formadepagamento','meiodepagamento','cartao','payment']};
const xlNum=v=>{if(typeof v==='number')return v;let s=String(v??'').replace(/[^\d,.\-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?n:0};
const catFrom=v=>{const n=norm(v);if(!n)return 'out';const c=CATS.find(c=>norm(c[0])===n||norm(c[1])===n)||CATS.find(c=>norm(c[1]).startsWith(n)||n.startsWith(norm(c[1]).slice(0,6)));return c?c[0]:'out'};
const payFrom=v=>{const n=norm(v);if(!n)return 'Cartão de crédito';const ex=PAYS.find(p=>norm(p)===n);if(ex)return ex;if(n.includes('chase'))return 'Cartão de crédito Chase (EUA)';if(n.includes('wise')||n.includes('nomad')||n.includes('global'))return 'Cartão global (Wise/Nomad)';if(n.includes('dinheiro')||n.includes('cash'))return 'Dinheiro';if(n.includes('pix')||n.includes('transf')||n.includes('zelle'))return 'Pix/transferência';if(n.includes('cartao')||n.includes('credito')||n.includes('card'))return 'Cartão de crédito';return 'Outro'};
const curFrom=v=>{const n=norm(v);return (n==='brl'||n==='r'||n==='real'||n==='reais')?'BRL':'USD'};
const expKey=e=>(e.date||'')+'|'+num(e.amt).toFixed(2)+'|'+e.cur;
let importExp=null;
async function parseGastos(file){const X=await loadXL();const wb=X.read(await file.arrayBuffer(),{type:'array'});
  for(const n of wb.SheetNames){const rows=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    for(let i=0;i<Math.min(rows.length,15);i++){const ix={};rows[i].forEach((c,k)=>{const nn=norm(c);for(const[key,al]of Object.entries(ECOLS))if(ix[key]===undefined&&al.includes(nn))ix[key]=k});
      if(ix.date===undefined||ix.amt===undefined)continue;const out=[];
      for(const r of rows.slice(i+1)){if(r.every(c=>String(c).trim()===''))break;const date=xlDate(r[ix.date]);const amt=xlNum(r[ix.amt]);if(!date||!(amt>0))continue;
        const g=k=>ix[k]===undefined?'':String(r[ix[k]]??'').trim();out.push({id:'imp'+uid(),amt:+amt.toFixed(2),cur:curFrom(g('cur')),cat:catFrom(g('cat')),desc:g('desc').slice(0,120),date,pay:payFrom(g('pay')),photo:'',ts:Date.now()})}
      if(out.length)return out}}
  throw new Error('Não achei as colunas "Data" e "Valor". Use o modelo baixado pelo app.')}
async function onImportExp(file){try{toast('Lendo planilha…');const all=await parseGastos(file);const have=new Set(S.exp.map(expKey));const novos=[],dup=[];all.forEach(e=>{const k=expKey(e);if(have.has(k))dup.push(e);else{novos.push(e);have.add(k)}});importExp=novos;kind='impx';editId='';
  const li=(e,c)=>`<li><span>${esc(fd(e.date,{day:'2-digit',month:'short',year:'2-digit'}))} · ${esc(e.desc||cat(e.cat)[1])} <span class="small mut">${esc(cat(e.cat)[1])} · ${esc(e.pay)}</span></span><b style="white-space:nowrap${c?';color:var(--mut)':''}">${esc(money(e.amt,e.cur))}</b></li>`;
  open(`<h2>Importar gastos</h2><p>${novos.length} gasto(s) novo(s)${dup.length?` · ${dup.length} já estava(m) no app e será(ão) ignorado(s)`:''}.</p>
  ${novos.length?`<ol class="stops">${novos.map(e=>li(e)).join('')}</ol>`:''}${dup.length?`<p class="small mut" style="margin-top:12px">Já no app (mesma data, valor e moeda):</p><ol class="stops">${dup.map(e=>li(e,1)).join('')}</ol>`:''}
  <p class="small mut">Confira categorias e formas de pagamento; dá para corrigir depois tocando no gasto.</p><div class="row" style="margin-top:16px">${novos.length?`<button class="btn pri" type="submit">Importar ${novos.length} gasto(s)</button>`:''}<button class="btn" type="button" data-act="close">${novos.length?'Cancelar':'Fechar'}</button></div><p class="small mut" id="fmsg"></p>`)}
  catch(e){toast(e.message||'Não consegui ler a planilha')}}
async function exportGastos(){const X=await loadXL();const L=[...S.exp].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const aoa=[['Data','Categoria','Descrição','Valor','Moeda','Pagamento','US$','R$']].concat(L.map(e=>[e.date?e.date.split('-').reverse().join('/'):'',cat(e.cat)[1],e.desc,num(e.amt),e.cur,e.pay,+usd(e).toFixed(2),+brl(e).toFixed(2)]));
  const wb=X.utils.book_new();const s=X.utils.aoa_to_sheet(aoa);s['!cols']=[{wch:11},{wch:28},{wch:50},{wch:12},{wch:7},{wch:30},{wch:12},{wch:12}];X.utils.book_append_sheet(wb,s,'Gastos');
  const s2=X.utils.aoa_to_sheet([['Como usar'],['Uma linha por gasto. Data dd/mm/aaaa. Moeda: USD ou BRL. Colunas US$ e R$ são só informativas (o app recalcula).'],['Categorias: '+CATS.map(c=>c[1]).join(' · ')],['Pagamento: '+PAYS.join(' · ')],['No app: Gastos → Importar planilha. Gastos com mesma data, valor e moeda que já existem são ignorados.']]);s2['!cols']=[{wch:120}];X.utils.book_append_sheet(wb,s2,'Como usar');
  await deliver(new Blob([X.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'gastos-viagem-'+stamp()+'.xlsx')}

/* ================= exportação ================= */
async function deliver(blob,name){const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);return true}
const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const csv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
function csvExp(){return csv([['Data','Categoria','Descrição','Valor','Moeda','US$','R$','Pagamento']].concat([...S.exp].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(e=>[e.date,cat(e.cat)[1],e.desc,num(e.amt).toFixed(2).replace('.',','),e.cur,usd(e).toFixed(2).replace('.',','),brl(e).toFixed(2).replace('.',','),e.pay])))}
function csvVis(){const V=vis();return csv([['Lugar','Chegada','Saída','Tempo no lugar (min)','Estrada antes (min)','Latitude','Longitude','Anotação']].concat(V.map((v,i)=>{const p=V[i-1];return [v.place,v.arr.replace('T',' '),(v.dep||'').replace('T',' '),v.dep?Math.round(ms(v.arr,v.dep)/6e4):'',p&&p.dep&&p.dep.slice(0,10)===v.arr.slice(0,10)?Math.round(ms(p.dep,v.arr)/6e4):'',v.arrGps?.lat??'',v.arrGps?.lng??'',v.note]})))}
async function photoData(id,max){if(!id)return '';try{const b=await idb.get('photos',id);if(!b)return '';return await toData(max?await shrink(b,max,.7):b)}catch(e){return ''}}
async function buildReport(){const L=days(),T=totals(S.exp),V=vis();let at=0,road=0;V.forEach((v,i)=>{if(v.dep)at+=ms(v.arr,v.dep);const p=V[i-1];if(p&&p.dep&&p.dep.slice(0,10)===v.arr.slice(0,10))road+=ms(p.dep,v.arr)});
  const ph={};for(const id of [...S.exp.map(e=>e.photo),...S.visits.map(v=>v.photo)].filter(Boolean))ph[id]=await photoData(id,1000);
  const img=id=>ph[id]?`<img src="${ph[id]}" alt="">`:'';
  const tb=rows=>{const m=rows.length?rows[0][1]:1;return `<table>${rows.map(([l,v,c])=>`<tr><td>${esc(l)}</td><td style="width:45%"><div class="b"><i style="width:${(v/m*100).toFixed(1)}%;background:${c}"></i></div></td><td class="n">${esc(money(v))}</td><td class="n">${esc(money(v*rate(),'BRL'))}</td></tr>`).join('')}</table>`};
  const first=L[0]?.date||'9999';const pre=S.exp.filter(e=>(e.date||'')<first);
  const dayBlocks=L.map((d,i)=>{const dv=V.filter(v=>v.arr.slice(0,10)===d.date);const de=S.exp.filter(e=>e.date===d.date);const sum=de.reduce((s,e)=>s+usd(e),0);
    return `<section class="day"><h2>Dia ${i+1} · ${esc(fd(d.date,{weekday:'long',day:'2-digit',month:'long'}))}</h2><p class="m"><b>${esc(d.title||'')}</b>${d.from&&d.to&&d.from!==d.to?' · '+esc(d.from)+' → '+esc(d.to):''}${d.stay?' · pernoite: '+esc(d.stay):''}</p>
    ${dv.length?`<h3>Onde estivemos</h3><table>${dv.map((v,j)=>{const p=dv[j-1];return (p&&p.dep?`<tr class="leg"><td></td><td colspan="3">estrada ${esc(dur(ms(p.dep,v.arr)))}</td></tr>`:'')+`<tr><td class="n">${esc(hm(v.arr))}–${esc(hm(v.dep))}</td><td><b>${esc(v.place)}</b>${v.note?'<br><span class="m">'+esc(v.note)+'</span>':''}</td><td class="n">${v.dep?esc(dur(ms(v.arr,v.dep))):''}</td><td>${v.arrGps?`<a href="${esc(mapll(v.arrGps.lat,v.arrGps.lng))}">mapa</a>`:''}</td></tr>${v.photo&&ph[v.photo]?`<tr><td></td><td colspan="3">${img(v.photo)}</td></tr>`:''}`}).join('')}</table>`:`<p class="m">Planejado: ${esc(stopsOf(d).map(s=>s.name).join(' · ')||'—')}</p>`}
    ${de.length?`<h3>Gastos do dia · ${esc(money(sum))}</h3><table>${de.map(e=>`<tr><td>${esc(cat(e.cat)[1])}</td><td>${esc(e.desc)}<br><span class="m">${esc(e.pay||'')}</span></td><td class="n">${esc(money(num(e.amt),e.cur))}</td><td class="n">${esc(e.cur==='BRL'?money(usd(e)):money(brl(e),'BRL'))}</td></tr>${e.photo&&ph[e.photo]?`<tr><td></td><td colspan="3">${img(e.photo)}</td></tr>`:''}`).join('')}</table>`:''}</section>`}).join('');
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório — Motorhome EUA 2027</title><style>
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:#141714;margin:0 auto;max-width:900px;padding:32px 20px}h1{font-size:34px;margin:0 0 4px;line-height:1.1}h2{font-size:20px;margin:0 0 4px}h3{font-size:15px;margin:16px 0 6px}
.hero{background:#0b6a3d;color:#fff;border-radius:14px;padding:22px 24px;box-shadow:inset 0 0 0 4px #0b6a3d,inset 0 0 0 7px #fff;margin-bottom:24px}.hero p{margin:4px 0 0;opacity:.9}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:18px 0}.k div{border:1px solid #dfe3de;border-radius:12px;padding:12px}.k b{display:block;font-size:24px}
table{width:100%;border-collapse:collapse;margin:6px 0}td{padding:6px 8px;border-top:1px solid #e6e9e4;vertical-align:top}.n{text-align:right;white-space:nowrap}.m{color:#5b655f}
.b{height:10px;background:#eef0ec;border-radius:5px;overflow:hidden}.b i{display:block;height:100%}.leg td{color:#1d4ea3;font-size:13px;border:0;padding:0 8px}
.day{border-top:3px solid #0b6a3d;padding-top:14px;margin-top:28px;break-inside:avoid-page}img{max-width:260px;max-height:260px;border-radius:8px;margin:4px 6px 4px 0}
@media print{body{padding:0}.day{break-inside:auto}}</style></head><body>
<div class="hero"><h1>Motorhome EUA 2027</h1><p>${esc(fd(L[0]?.date,{day:'2-digit',month:'long'}))} a ${esc(fd(L[L.length-1]?.date,{day:'2-digit',month:'long',year:'numeric'}))} · gerado em ${esc(new Date().toLocaleString('pt-BR'))}</p></div>
<div class="k"><div>Total gasto<b>${esc(money(T.tot))}</b>${esc(money(T.tot*rate(),'BRL'))}</div><div>Lugares visitados<b>${V.length}</b>${esc(dur(at))} nos lugares</div><div>Na estrada<b>${esc(dur(road))}</b>entre paradas do mesmo dia</div><div>Câmbio usado<b>R$ ${esc(rate().toFixed(2).replace('.',','))}</b>por US$</div></div>
<h2>Gastos por categoria</h2>${tb(T.by)}<h2 style="margin-top:20px">Por forma de pagamento</h2>${tb(T.bp)}
${pre.length?`<section class="day"><h2>Antes da viagem</h2><table>${pre.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.desc)}</td><td class="n">${esc(money(num(e.amt),e.cur))}</td><td class="n">${esc(e.cur==='BRL'?money(usd(e)):money(brl(e),'BRL'))}</td></tr>`).join('')}</table></section>`:''}
${dayBlocks}
${(S.notes||[]).length?`<section class="day"><h2>Anotações e lembretes</h2><table>${[...S.notes].sort((a,b)=>(a.when||'9').localeCompare(b.when||'9')).map(n=>`<tr><td class="n">${n.when?esc(fd(n.when,{day:'2-digit',month:'short'}))+' '+esc(hm(n.when)):''}</td><td style="white-space:pre-line">${n.done?'✓ ':''}${esc(n.text)}</td></tr>`).join('')}</table></section>`:''}</body></html>`;
  return new Blob([html],{type:'text/html'})}
async function backup(){const photos={};for(const k of await idb.keys('photos'))photos[k]=await photoData(k,0);S.cfg.lastBackup=iso(Date.now());
  const blob=new Blob([JSON.stringify({app:'viagem-rv',v:1,saved:S.cfg.lastBackup,state:S,photos})],{type:'application/json'});const ok=await deliver(blob,'backup-viagem-'+S.cfg.lastBackup.replace(/[:T]/g,'-')+'.json');if(ok)await save();else S.cfg.lastBackup=''}
async function restore(file){try{const j=JSON.parse(await file.text());if(j.app!=='viagem-rv'||!j.state)throw new Error('arquivo não é um backup deste app');
  await idb.clear('photos');for(const[k,u]of Object.entries(j.photos||{})){const b=await (await fetch(u)).blob();await idb.set('photos',k,b)}S=j.state;S.notes=S.notes||[];S.visits=S.visits||[];await save();toast('Backup restaurado')}catch(e){toast('Não foi possível restaurar: '+(e.message||e))}}

/* ================= eventos ================= */
let delArm=0;const stamp=()=>new Date().toISOString().slice(0,10);
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='exp')openExp(el.dataset.id);
  else if(a==='arr')openArr();
  else if(a==='arrq'){el.disabled=true;await arrive(el.dataset.place)}
  else if(a==='dep'){el.disabled=true;await depart()}
  else if(a==='vis')openVis(el.dataset.id);
  else if(a==='day')openDay(el.dataset.id);
  else if(a==='stop')openStop(el.dataset.id);
  else if(a==='close')close();
  else if(a==='ai')readReceipt(el);
  else if(a==='aikey'){const v=($('#aik').value||'').trim();if(v&&!/^sk-ant-/.test(v)){toast('A chave começa com sk-ant-');return}aiKey=v;try{await idb.set('kv','apikey',v)}catch(e){}toast(v?'Chave salva neste iPhone':'Chave removida');render()}
  else if(a==='note')openNote(el.dataset.id);
  else if(a==='ntog'){const n=(S.notes||[]).find(x=>x.id===el.dataset.id);if(n){n.done=!n.done;n.ts=Date.now();await save()}}
  else if(a==='ics'){const n=(S.notes||[]).find(x=>x.id===editId);if(!n||!n.when)return;await deliver(new Blob([icsFor(n)],{type:'text/calendar'}),'lembrete.ics')}
  else if(a==='addpt'){$('#pts').insertAdjacentHTML('beforeend',ptRow({name:'',addr:''}));const ins=$('#pts').querySelectorAll('input[name=pn]');ins[ins.length-1].focus()}
  else if(a==='delpt'){const r=el.closest('.pt');if($('#pts').children.length>1)r.remove();else r.querySelectorAll('input').forEach(i=>i.value='')}
  else if(a==='pick')form.elements['place'].value=el.dataset.v;
  else if(a==='del'){if(Date.now()-delArm>4000){delArm=Date.now();el.textContent='Toque de novo para excluir';return}
    if(kind==='note')S.notes=(S.notes||[]).filter(x=>x.id!==editId);if(kind==='exp')S.exp=S.exp.filter(x=>x.id!==editId);if(kind==='vis')S.visits=S.visits.filter(x=>x.id!==editId);if(kind==='day')S.days=S.days.filter(x=>x.id!==editId);if(curPhoto&&kind!=='day')idb.del('photos',curPhoto).catch(()=>{});await save();toast('Excluído');close()}
  else if(a==='mv'||a==='rm'){const d=S.days.find(x=>x.id===el.dataset.id);if(!d)return;const L=lines(d.stops),i=+el.dataset.i;
    if(a==='rm'&&!el.classList.contains('arm')){el.classList.add('arm');el.textContent='Remover?';setTimeout(()=>{if(el.isConnected){el.classList.remove('arm');el.textContent='✕'}},3500);return}
    if(a==='mv'){const j=i+(+el.dataset.dir);if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]]}else L.splice(i,1);await saveDay(d,L)}
  else if(a==='fw'){fWhen=el.dataset.k;render()}
  else if(a==='report'){el.disabled=true;el.textContent='Montando relatório…';try{await deliver(await buildReport(),'relatorio-viagem-'+stamp()+'.html')}catch(e){toast('Erro ao montar relatório')}render()}
  else if(a==='xle'){el.disabled=true;try{await exportGastos()}catch(e){toast(e.message||'Erro ao gerar planilha')}el.disabled=false}
  else if(a==='xlx'){el.disabled=true;try{await exportRoteiro()}catch(e){toast(e.message||'Erro ao gerar planilha')}el.disabled=false}
  else if(a==='csv')deliver(new Blob([csvExp()],{type:'text/csv'}),'gastos-viagem-'+stamp()+'.csv');
  else if(a==='csvv')deliver(new Blob([csvVis()],{type:'text/csv'}),'lugares-tempos-'+stamp()+'.csv');
  else if(a==='backup'){el.disabled=true;el.textContent='Preparando…';try{await backup()}catch(e){toast('Erro no backup')}render()}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.act==='fc'){fCat=t.value;render()}
  if(t.id==='restore'&&t.files[0])restore(t.files[0]);
  if(t.id==='impx'&&t.files[0]){onImportFile(t.files[0]);t.value=''}
  if(t.id==='impe'&&t.files[0]){onImportExp(t.files[0]);t.value=''}
  if(t.dataset.cfg){const v=num(t.value);if(t.dataset.cfg==='rate'&&!v){toast('Câmbio inválido');return}S.cfg[t.dataset.cfg]=v;t.blur();save();toast('Atualizado')}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&sheet.classList.contains('open'))close()});
sheet.addEventListener('click',ev=>{if(ev.target===sheet)close()});
addEventListener('hashchange',render);
setInterval(()=>{if(!sheet.classList.contains('open'))render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheet.classList.contains('open'))render()});

/* ================= início ================= */
(async()=>{try{const st=await idb.get('kv','state');if(st)S=st;else if(self.SEED){S=JSON.parse(JSON.stringify(self.SEED));await idb.set('kv','state',S)}}catch(e){toast('Este navegador não permite guardar dados')}
  S.visits=S.visits||[];S.notes=S.notes||[];S.cfg=S.cfg||{rate:5.87};try{aiKey=(await idb.get('kv','apikey'))||''}catch(e){}render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})})();
}
